[workspace]
resolver = "2"
members = [
    "program",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["1inch"]
license = "MIT"
repository = "https://github.com/1inch/atomic-swap-v2"

[workspace.dependencies]
solana-program = "=2.2.16"
solana-sdk = "=2.2.16"
solana-program-test = "=2.2.16"
pinocchio = "0.8.4"
thiserror = "1.0"
num-derive = "0.4"
num-traits = "0.2"
spl-token = "6.1"
bincode = "1.3"
tokio = { version = "1", features = ["macros"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release.build-override]
opt-level = 3